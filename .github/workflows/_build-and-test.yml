name: Build and Test

env:
  ServiceDefaultsVersion: 1.0.93
  MessagingContractsVersion: 1.0.99-alpha

on:
  workflow_call:
    inputs:
      solution_file:
        required: true
        type: string
      configuration:
        required: false
        type: string
        default: Release
      extra_args:
        required: false
        type: string
        default: ""
    secrets:
      gitops_pat:
        required: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout Service
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: service
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore ${{ inputs.solution_file }} -p:GITHUB_ACTIONS=true -p:ServiceDefaultsVersion=1.0.93 -p:MessagingContractsVersion=1.0.99-alpha ${{ inputs.extra_args }}
        working-directory: service
        env:
          NUGET_USERNAME: ${{ github.actor }}
          NUGET_PASSWORD: ${{ secrets.gitops_pat }}

      - name: Record resolved package graph
        run: dotnet list ${{ inputs.solution_file }} package --include-transitive --no-restore
        working-directory: service

      - name: Build
        run: dotnet build ${{ inputs.solution_file }} --no-restore --configuration ${{ inputs.configuration }} -p:GITHUB_ACTIONS=true -p:ServiceDefaultsVersion=1.0.93 -p:MessagingContractsVersion=1.0.99-alpha ${{ inputs.extra_args }}
        working-directory: service

      - name: Test
        run: dotnet test ${{ inputs.solution_file }} --no-build --no-restore --configuration ${{ inputs.configuration }} --verbosity normal -p:GITHUB_ACTIONS=true -p:ServiceDefaultsVersion=1.0.93 -p:MessagingContractsVersion=1.0.99-alpha ${{ inputs.extra_args }}
        working-directory: service
