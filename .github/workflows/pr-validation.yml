name: PR Validation

on:
  pull_request:
    branches: [develop, staging, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  NUGET_PACKAGES: ${{ github.workspace }}/.ci-nuget/packages
  ServiceDefaultsVersion: 1.0.93
  MessagingContractsVersion: 1.0.99-alpha

jobs:
  dependency-packages:
    name: Build exact public-source dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      artifact-digest: ${{ steps.upload.outputs.artifact-digest }}
    steps:
      - name: Checkout JobService source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Checkout exact MessagingContracts source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: MALIEV-Co-Ltd/Maliev.MessagingContracts
          ref: 9c41d6524a485bf03ba022b8170f47366ab1a77a
          path: .ci-sources/Maliev.MessagingContracts
          persist-credentials: false

      - name: Checkout exact ServiceDefaults source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: MALIEV-Co-Ltd/Maliev.Aspire
          ref: 20a2746e024de6bd070b51af99bab7b761612c06
          path: .ci-sources/Maliev.Aspire
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: 10.0.x

      - name: Build exact dependency packages
        run: bash scripts/prepare-job-ci-packages.sh

      - name: Upload exact dependency packages
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: job-ci-packages-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci-packages/*
          if-no-files-found: error
          include-hidden-files: true
          overwrite: true
          retention-days: 1

      - name: Validate dependency artifact digest
        shell: bash
        env:
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          test -n "$ARTIFACT_DIGEST"
          [[ "$ARTIFACT_DIGEST" =~ ^[0-9a-f]{64}$ ]]

  build-and-test:
    name: Release build, test, and audit
    needs: dependency-packages
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: 10.0.x

      - name: Download exact dependency packages
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: job-ci-packages-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci-packages

      - name: Verify dependency artifact integrity
        shell: bash
        env:
          ARTIFACT_DIGEST: ${{ needs.dependency-packages.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          test -n "$ARTIFACT_DIGEST"
          printf 'GitHub artifact digest: %s\n' "$ARTIFACT_DIGEST"
          (cd .ci-packages && sha256sum --check SHA256SUMS)

      - name: Restore exact package graph
        run: >-
          dotnet restore Maliev.JobService.slnx
          --configfile NuGet.PRValidation.Config
          -p:GITHUB_ACTIONS=true
          -p:ServiceDefaultsVersion=1.0.93
          -p:MessagingContractsVersion=1.0.99-alpha

      - name: Record resolved package graph
        run: dotnet list Maliev.JobService.slnx package --include-transitive --no-restore

      - name: Build
        run: dotnet build Maliev.JobService.slnx --configuration Release --no-restore -p:GITHUB_ACTIONS=true -p:ServiceDefaultsVersion=1.0.93 -p:MessagingContractsVersion=1.0.99-alpha

      - name: Test canonical payment consumers
        run: >-
          dotnet test Maliev.JobService.slnx
          --configuration Release
          --no-build
          --no-restore
          --filter "FullyQualifiedName~PaymentCompletedJobCreationConsumerTests|FullyQualifiedName~OrderPaidEventConsumerTests"
          --verbosity normal
          -p:GITHUB_ACTIONS=true
          -p:ServiceDefaultsVersion=1.0.93
          -p:MessagingContractsVersion=1.0.99-alpha

      - name: Test
        run: dotnet test Maliev.JobService.slnx --configuration Release --no-build --no-restore --verbosity normal -p:GITHUB_ACTIONS=true -p:ServiceDefaultsVersion=1.0.93 -p:MessagingContractsVersion=1.0.99-alpha

      - name: Audit resolved NuGet graph
        run: dotnet list Maliev.JobService.slnx package --include-transitive --vulnerable --no-restore --configfile NuGet.PRValidation.Config

  container:
    name: Build and scan production image
    needs: dependency-packages
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      IMAGE_TAG: maliev-job-service:pr-validation-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Download exact dependency packages
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: job-ci-packages-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci-packages

      - name: Verify dependency artifact integrity
        shell: bash
        env:
          ARTIFACT_DIGEST: ${{ needs.dependency-packages.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          test -n "$ARTIFACT_DIGEST"
          printf 'GitHub artifact digest: %s\n' "$ARTIFACT_DIGEST"
          (cd .ci-packages && sha256sum --check SHA256SUMS)

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build local production image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Maliev.JobService.Api/Dockerfile
          load: true
          push: false
          tags: ${{ env.IMAGE_TAG }}
          build-args: |
            dependency_restore_stage=restore-local
            SERVICE_DEFAULTS_VERSION=${{ env.ServiceDefaultsVersion }}
            MESSAGING_CONTRACTS_VERSION=${{ env.MessagingContractsVersion }}

      - name: Validate runtime image metadata
        shell: bash
        run: |
          set -euo pipefail
          metadata="$(docker image inspect "$IMAGE_TAG")"
          test "$(jq -r '.[0].Config.User' <<< "$metadata")" = "app"
          test "$(jq -c '.[0].Config.Entrypoint' <<< "$metadata")" = '["dotnet","Maliev.JobService.Api.dll"]'
          test "$(jq -r '.[0].Config.ExposedPorts | has("8080/tcp")' <<< "$metadata")" = "true"

      - name: Smoke test production image liveness
        shell: bash
        run: |
          set -euo pipefail
          network_name="job-smoke-net-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          database_name="job-smoke-db-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          application_name="job-smoke-app-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          # shellcheck disable=SC2317 # Invoked indirectly by the EXIT trap.
          cleanup() {
            docker rm --force "$application_name" "$database_name" >/dev/null 2>&1 || true
            docker network rm "$network_name" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker network create "$network_name" >/dev/null
          docker run --detach \
            --name "$database_name" \
            --network "$network_name" \
            --env POSTGRES_PASSWORD=job-smoke-password \
            --env POSTGRES_DB=JobDb \
            postgres:18-alpine >/dev/null

          for attempt in {1..30}; do
            if docker exec "$database_name" pg_isready --username postgres --dbname JobDb >/dev/null 2>&1; then
              break
            fi
            if [[ "$attempt" == "30" ]]; then
              docker logs "$database_name"
              exit 1
            fi
            sleep 1
          done

          docker run --detach \
            --name "$application_name" \
            --network "$network_name" \
            --publish "127.0.0.1:18080:8080" \
            --env ASPNETCORE_ENVIRONMENT=Testing \
            --env Cache__RedisEnabled=false \
            --env CORS__AllowedOrigins__0=http://localhost \
            --env MassTransit__UseInMemory=true \
            --env Features__FailOpenOnIAMError=true \
            --env IAM__RegistrationDelaySeconds=0 \
            --env "ConnectionStrings__JobDbContext=Host=$database_name;Port=5432;Database=JobDb;Username=postgres;Password=job-smoke-password" \
            "$IMAGE_TAG" >/dev/null

          for attempt in {1..60}; do
            if curl --fail --silent "http://127.0.0.1:18080/job/liveness" >/dev/null; then
              exit 0
            fi
            if [[ "$(docker inspect --format '{{.State.Running}}' "$application_name")" != "true" ]]; then
              docker logs "$application_name"
              exit 1
            fi
            sleep 1
          done

          docker logs "$application_name"
          exit 1

      - name: Generate image SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_TAG }}
          format: cyclonedx
          output: trivy-sbom.cdx.json
          scanners: vuln
          exit-code: "0"

      - name: Validate SBOM output
        run: test -s trivy-sbom.cdx.json

      - name: Scan image for high-severity vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_TAG }}
          format: table
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: "1"
