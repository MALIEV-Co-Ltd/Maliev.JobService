name: Validate - Release Tag

env:
  ServiceDefaultsVersion: 1.0.93
  MessagingContractsVersion: 1.0.99-alpha

on:
  push:
    tags:
      - "release/v*"

permissions:
  contents: read
  packages: read

jobs:
  build-and-test:
    uses: ./.github/workflows/_build-and-test.yml
    with:
      solution_file: Maliev.JobService.slnx
      extra_args: >-
        -p:GITHUB_ACTIONS=true
        -p:ServiceDefaultsVersion=1.0.93
        -p:MessagingContractsVersion=1.0.99-alpha
    secrets:
      gitops_pat: ${{ secrets.GITOPS_PAT }}
